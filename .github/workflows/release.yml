name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install Lua 5.1 and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1 zip unzip

      - name: Validate tag, source, and tests
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F': *' '/^## Version:/ { print $2; exit }' TrashPanda.toc)"
          test "v${version}" = "${GITHUB_REF_NAME}"
          mapfile -t addon_files < <(awk 'NF && $1 !~ /^##/' TrashPanda.toc)
          for file in "${addon_files[@]}"; do
            test -f "$file"
            luac5.1 -p "$file"
          done
          luac5.1 -p tests/run.lua
          lua5.1 tests/run.lua

      - name: Build clean addon archive
        id: package
        shell: bash
        run: |
          archive="$(bash scripts/package.sh "$RUNNER_TEMP/dist")"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          unzip -t "$archive"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.archive }}" \
            --title "TrashPanda ${GITHUB_REF_NAME#v}" \
            --generate-notes
