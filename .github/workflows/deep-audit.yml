name: Deep Audit

on:
  pull_request:
    paths:
      - "Feature/AutoSell.lua"
      - "Core/Locale.lua"
      - "Util/Format.lua"
      - "tests/time_origin.lua"
      - "tests/module_contracts.lua"
      - ".github/workflows/deep-audit.yml"
  push:
    branches:
      - main
    paths:
      - "Feature/AutoSell.lua"
      - "Core/Locale.lua"
      - "Util/Format.lua"
      - "tests/time_origin.lua"
      - "tests/module_contracts.lua"
      - ".github/workflows/deep-audit.yml"

permissions:
  contents: read

jobs:
  lua51-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Compile audited Lua files
        run: |
          luac5.1 -p Feature/AutoSell.lua
          luac5.1 -p Core/Locale.lua
          luac5.1 -p Util/Format.lua
          luac5.1 -p tests/time_origin.lua
          luac5.1 -p tests/module_contracts.lua

      - name: Run zero-origin timeout regression
        run: lua5.1 tests/time_origin.lua

      - name: Run module contracts
        run: lua5.1 tests/module_contracts.lua
